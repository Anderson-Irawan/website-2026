<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Double Dash Creative</title>
    <meta name="description" content="That page is not here. Head back to the projects.">
    <!-- an error page has nothing worth indexing -->
    <meta name="robots" content="noindex">

    <!-- Plantin (Adobe Fonts): the display serif, used as font-marker in styles.css -->
    <link rel="stylesheet" href="https://use.typekit.net/bzi8cqp.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="icon" href="/assets/favicon.ico" sizes="any">
    <script>document.documentElement.classList.add("is-loading");</script>
    <!-- Apply the saved motion setting before anything paints, so a
         reduced-motion visitor never sees a frame of movement first. -->
    <script>try{if(localStorage.getItem('liquid-hero:reduced')==='1')document.documentElement.classList.add('liquid-hero-reduced');}catch(e){}</script>
</head>

<body>
    <!-- Loading screen: spinning mark, hidden again by initPageLoader() -->
    <div class="page-loader" role="status" aria-label="Loading">
        <img class="page-loader__mark" src="/assets/logos/logo-prime.svg" alt="">
    </div>

    <!-- Topographic lines on the black ground. See js/topo-bg.js -->
    <canvas class="topo-bg" data-topo-bg aria-hidden="true"></canvas>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="/index.html" class="logo">
                <img src="/assets/logotype.svg" alt="Double Dash Creative" class="logo-mark">
            </a>


            <ul class="nav-links">
                <li><a href="/projects.html" class="nav-link-cycle"><span data-text="Projects">Projects</span></a></li>
                <li><a href="/about.html" class="nav-link-cycle"><span data-text="About">About</span></a></li>
                <li><a href="/contact.html" class="nav-link-cycle"><span data-text="Contact">Contact</span></a></li>
            </ul>
            <div class="nav-actions">
                <button class="motion-toggle" type="button" data-liquid-hero-toggle aria-pressed="false">
                    <span class="motion-toggle__icon" aria-hidden="true"></span>
                    <span class="motion-toggle__label">Reduce Motion</span>
                </button>
                <button class="mobile-menu-toggle" aria-label="Toggle menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>

        </div>
    </nav>

    <!-- 404 -->
    <section class="section notfound">
        <div class="container">
            <p class="notfound__code">404</p>
            <h1 class="page-header__title">This page galloped off.</h1>
            <p class="notfound__body">
                The link is broken, or the page moved somewhere else. Everything
                else is still exactly where you would expect it.
            </p>
            <div class="notfound__actions">
                <a href="/projects.html" class="btn btn-primary">See the projects</a>
                <a href="/index.html" class="notfound__home">or go back home</a>
            </div>
        </div>
    </section>

    <script src="/js/main.js"></script>

    <script src="/js/topo-bg.js"></script>
</body>

</html>
