<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Double Dash Creative</title>
    <meta name="description" content="That page is not here. Head back to the projects.">
    <!-- an error page has nothing worth indexing -->
    <meta name="robots" content="noindex">

    <link rel="stylesheet" href="/css/styles.css">
    <link rel="icon" href="/assets/favicon.ico" sizes="any">
    <script>document.documentElement.classList.add("is-loading");</script>
</head>

<body>
    <!-- Loading screen: spinning mark, hidden again by initPageLoader() -->
    <div class="page-loader" role="status" aria-label="Loading">
        <img class="page-loader__mark" src="/assets/logos/logo-prime.svg" alt="">
    </div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="/index.html" class="logo">
                <img src="/assets/logotype.svg" alt="Double Dash Creative" class="logo-mark">
            </a>

            <button class="mobile-menu-toggle" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <ul class="nav-links">
                <li><a href="/projects.html" class="nav-link-cycle"><span data-text="Projects">Projects</span></a></li>
                <li><a href="/about.html" class="nav-link-cycle"><span data-text="About">About</span></a></li>
                <li><a href="/contact.html" class="nav-link-cycle"><span data-text="Contact">Contact</span></a></li>
            </ul>
        </div>
    </nav>

    <!-- 404 -->
    <section class="section notfound">
        <div class="container">
            <p class="notfound__code">404</p>
            <h1 class="page-header__title">This page ran off.</h1>
            <p class="notfound__body">
                The link is broken, or the page moved somewhere else. Everything
                else is still exactly where you would expect it.
            </p>
            <div class="notfound__actions">
                <a href="/projects.html" class="btn btn-primary">See the projects</a>
                <a href="/index.html" class="notfound__home">or go back home</a>
            </div>
        </div>
    </section>

    <script src="/js/main.js"></script>

</body>

</html>
